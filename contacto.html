<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Clase Gratis | Academia Bordiez</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="contenedor-header">
            <img src="img/Bordiez - Logo AB10.png" alt="Logo Academia Bordiez" class="logo">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="servicios.html">Disciplinas y Aranceles</a></li>
                    <li><a href="contacto.html" class="activo">Contacto y Clase Gratis</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <section>
            <h1>Reservá tu Clase de Prueba Gratis</h1>
            <p>Completa el formulario para coordinar tu primera clase sin cargo en cualquiera de nuestras sedes.</p>
            <br>
            <form action="#" method="POST" class="form-contacto">
                <div class="campo-form">
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="campo-form">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@email.com">
                </div>

                <div class="campo-form">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej: 1112345678">
                </div>

                <div class="campo-form">
                    <label for="sede">Sede de preferencia:</label>
                    <select id="sede" name="sede" required>
                        <option value="">Selecciona una sede...</option>
                        <option value="maschwitz">Ingeniero Maschwitz</option>
                        <option value="olivos">Olivos (Club Unión)</option>
                    </select>
                </div>

                <div class="campo-form">
                    <label for="actividad">Actividad de interés:</label>
                    <select id="actividad" name="actividad" required>
                        <option value="">Selecciona una actividad...</option>
                        <option value="tkd-kids">Taekwondo Kids (4 a 7 años)</option>
                        <option value="tkd-infantiles">Taekwondo Infantiles (8 a 12 años)</option>
                        <option value="tkd-adultos">Taekwondo Adultos / Competidores</option>
                        <option value="kick-femenino">Kickboxing Femenino</option>
                        <option value="kick-mixto">Kickboxing Mixto</option>
                    </select>
                </div>

                <div class="campo-form">
                    <label for="mensaje">Consulta o mensaje adicional:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu consulta aquí..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Solicitar Clase Gratis</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Academia Bordiez - Old School. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
